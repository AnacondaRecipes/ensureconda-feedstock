{% set name = "ensureconda" %}
{% set version = "1.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Upstream excludes the test suite from the sdist, so the GitHub release
  # tarball is fetched as a second source to run the unit tests.
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 03cf27ffc3c976f4770263ce4fd2740d32de636da30252195b0a8cd9b7e26558
  - url: https://github.com/conda-incubator/ensureconda/archive/v{{ version }}.tar.gz
    sha256: e621a96d6d3dd36d86ef1d5159b777e2c2b18e2c67fbf4aefbd8cc57921ccc32
    folder: gh_src

build:
  number: 0
  skip: true  # [py<38]
  entry_points:
    - ensureconda = ensureconda.cli:ensureconda_cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=0.21.1
    - hatch-vcs
  run:
    - python
    - appdirs
    - click >=5.1
    - filelock
    - packaging
    - requests >=2
    - conda-package-streaming

test:
  source_files:
    - gh_src/test/test_api.py
    - gh_src/test/test_installer.py
  imports:
    - ensureconda
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - ensureconda --help
    # The remaining upstream tests (test_python_library.py, test_go_binaries.py)
    # are not run: they require a Docker daemon / a Go toolchain and network access.
    - pytest -vv gh_src/test/test_api.py gh_src/test/test_installer.py

about:
  home: https://github.com/conda-incubator/ensureconda
  summary: Lightweight bootstrapper for a conda executable
  license: MIT
  license_family: MIT
  license_file: LICENSE-MIT
  description: |
    Install and run applications packaged with conda in isolated environments.
    Ensureconda is a cli tool that will:
    1. Find a preexisting conda/mamba executable
    2. Install one if nothing was found and installation is allowed.
    3. Return the path of the executable found/installed on stdout
  doc_url: https://github.com/conda-incubator/ensureconda
  dev_url: https://github.com/conda-incubator/ensureconda

extra:
  recipe-maintainers:
    - mariusvniekerk
